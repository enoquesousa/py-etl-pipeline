name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never

  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          pip-version: "26.2"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install "setuptools==84.1.0"
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        shell: bash
        run: |
          unset DATABASE_URL POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB POSTGRES_HOST POSTGRES_PORT
          unset PGHOST PGPORT PGUSER PGPASSWORD PGDATABASE TEST_POSTGRES_URL
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pytest -q --cov=py_etl_pipeline --cov-report=xml --cov-report=term-missing
          else
            python -m pytest -q
          fi

      - name: Check Compose password requirement
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          if env -u POSTGRES_PASSWORD docker compose --env-file /dev/null config --quiet >/dev/null 2>&1; then
            echo "Compose must reject a missing database password." >&2
            exit 1
          fi
          if POSTGRES_PASSWORD="" docker compose --env-file /dev/null config --quiet >/dev/null 2>&1; then
            echo "Compose must reject an empty database password." >&2
            exit 1
          fi
          POSTGRES_PASSWORD="ci-only-placeholder" docker compose --env-file /dev/null config --quiet

      - name: Audit installed dependencies
        shell: bash
        run: |
          python -m pip list --format=freeze > "$RUNNER_TEMP/etl-installed.txt"
          python -m venv "$RUNNER_TEMP/etl-ci-tools"
          "$RUNNER_TEMP/etl-ci-tools/bin/python" -m pip install "pip==26.2" "setuptools==84.1.0" "pip-audit==2.10.1" "build==1.6.1"
          "$RUNNER_TEMP/etl-ci-tools/bin/python" -m pip_audit -r "$RUNNER_TEMP/etl-installed.txt" --no-deps --disable-pip --strict --progress-spinner off

      - name: Build distributions
        run: '"$RUNNER_TEMP/etl-ci-tools/bin/python" -m build --outdir "$RUNNER_TEMP/etl-dist"'

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
