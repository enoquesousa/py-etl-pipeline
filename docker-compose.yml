services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a nonempty POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-data-py}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data

  etl:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a nonempty POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-data-py}
      LOAD_MODE: bulk
      RUN_SCHEDULED: "true"
      SCHEDULE_INTERVAL_MINUTES: "60"
      SALES_CSV_PATH: /app/data/sales_demo.csv
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

volumes:
  pg_data:

