[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-etl-pipeline"
version = "0.1.0"
description = "Minimal ETL pipeline with bulk loads and PostgreSQL upsert support"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "You", email = "you@example.com" }]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.urls]
"Homepage" = "https://github.com/enoquesousa/py-etl-pipeline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "main.py", "scripts"]
exclude = ["migrations"]
# Local CI venvs beside the repo (e.g. `.ci-venv312`) are not default Ruff excludes.
extend-exclude = [".ci-venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["py_etl_pipeline"]
